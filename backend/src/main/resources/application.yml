server:
  port: 8080

spring:
  application:
    name: ai-job-tracker

  datasource:
    url: jdbc:mysql://localhost:3306/ai_job_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

